services:
  app:
    build: .
    image: site-talk:local
    init: true
    restart: unless-stopped
    env_file:
      - ${SITE_TALK_ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SITE_TALK_DATA_DIR: /data
    ports:
      - "127.0.0.1:${SITE_TALK_PORT:-3000}:3000"
    volumes:
      - site-talk-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  site-talk-data:
